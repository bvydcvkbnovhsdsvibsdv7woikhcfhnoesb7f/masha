name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Set Android environment
      run: |
        echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Clean Gradle cache
      run: |
        rm -rf $HOME/.gradle/caches
        rm -rf $HOME/.gradle/wrapper

    - name: Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Create www folder and copy files
      run: |
        mkdir -p www
        cp index.html www/
        cp manifest.json www/
        cp sw.js www/
        cp icon-192.png www/ 2>/dev/null || true
        cp icon-512.png www/ 2>/dev/null || true
        cp -r avatars www/ 2>/dev/null || true
        ls -la www/

    - name: Create Capacitor config
      run: |
        cat > capacitor.config.json << 'EOF'
        {
          "appId": "com.masha.app",
          "appName": "Маша",
          "webDir": "www",
          "server": {
            "androidScheme": "https"
          }
        }
        EOF

    - name: Add Android platform
      run: npx cap add android

    - name: Sync assets
      run: npx cap sync android

    - name: Build APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew clean
        ./gradlew assembleRelease --no-daemon --no-parallel

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: masha-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
