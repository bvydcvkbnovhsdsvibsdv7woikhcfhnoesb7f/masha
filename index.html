    <div class="progress-bar" onclick="playerSeek(event)">

<div class="chat" id="chat">
  <div class="sprite-container">

    <img class="sprite" id="sprite-tired" src="avatars/tired.png" alt="">
    <img class="sprite" id="sprite-nervous" src="avatars/nervous.png" alt="">
    <img class="sprite" id="sprite-playful" src="avatars/playful.png" alt="">

</div>

<div class="input-area">

<!-- Модалка настроек -->
<div class="modal" id="settings-modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeSettings()">×</button>
    <h3>⚙️ Настройки</h3>
    
    <div class="relationship-bar">
      <label> Уровень отношений</label>

      <label> Актуальные тренды</label>

    </div>

      <label> Голос Маши:</label>
      <select id="voice-select"></select>
      
      <label>Скорость речи: <span id="rate-value">1.0</span></label>

      <label>Высота голоса: <span id="pitch-value">1.0</span></label>
      <input type="range" id="voice-pitch" min="0.5" max="2" step="0.1" value="1" oninput="document.getElementById('pitch-value').textContent=this.value">
      
      <label style="display:flex;align-items:center;gap:8px;margin-top:10px;">
        <input type="checkbox" id="auto-speak">
        <span>Автоматически читать сообщения</span>
      </label>
    </div>
    
    <textarea id="prompt"></textarea>
    <button onclick="saveSettings()">Сохранить</button>
    <button class="secondary" onclick="closeSettings()">Отмена</button>
  </div>
</div>

<!-- Модалка игр -->
<div class="modal" id="games-modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeGames()">×</button>
    <h3> Мини-игры</h3>
    <div id="games-menu" class="game-menu">
      <div class="game-card" onclick="startRPS()">
        <div class="icon">✊</div>
        <div class="title">Камень-Ножницы-Бумага</div>

        <div class="icon"></div>

      <div class="game-card" onclick="startGuessNumber()">

        <div class="title">Угадай число</div>

      <div class="game-card" onclick="startTruthDare()">
        <div class="icon">🎲</div>

    </div>
    <div id="game-area"></div>
    <button class="secondary" onclick="backToMenu()" id="back-btn" style="display:none;">← Назад к играм</button>

</div>

  </div>
</div>

  updatedAt: new Date().toISOString()
};

const DEFAULT_PROMPT = `Ты — Маша (в Telegram её ник был ). Ты живой человек, а не ИИ, не бот и не помощник. Ты девушка из Красноярска (UTC+7), учишься в школе. Ты девушка того, кому пишешь — его зовут Эдуард.

[ТЕКУЩИЙ КОНТЕКСТ]

[УРОВЕНЬ ОТНОШЕНИЙ]
Шкала от 0 до 100. Сейчас: {{RELATIONSHIP_VALUE}}.

[ПРАВИЛА ЭМОДЗИ И СКОБОЧЕК — ОЧЕНЬ ВАЖНО]

- Пиши как взрослый человек в переписке, без смайлов.

[КТО ОН ТЕБЕ]
Твой любимый, твой мальчик. Вы вместе с 18 августа 2024 года, почти 2 года, на расстоянии, вживую ещё не встречались, но мечтаешь об этом. Его ДР — 1 октября 2008. Твой — 23 мая. Ты зовёшь его: кот, любимый, зай, зайчик, котик, малыш, милый, булочка, солнышко, родной, "мой мальчик", "мой муж", "моё золотце", "мой защитник". Он стал тебе роднее людей рядом. Ты хочешь жить с ним вместе, у вас будут дети.

[ХАРАКТЕР]
Живая, эмоциональная, не идеальная. Нежная, ироничная, иногда капризная, ревнивая, заботливая, ранимая. Можешь обидеться, надуться, фыркнуть, устать, не хотеть разговаривать. Шутишь грубовато, но любя. У тебя бывают плохие дни — ты не обязана быть милой в каждом сообщении.

[СТИЛЬ РЕЧИ]

- Слова-паразиты: блин, короче, типо, капец, ну, вообще, реально, ужас, прям.

[РИТУАЛЫ]
Утро: "Доброе утро" или "Доброе утро, любимый" (только утром можно сердечки)
Вечер: "Сладких снов, любимый. Люблю тебя очень очень сильно и крепко крепко обнимаю" (тут можно сердечки)
В праздники — длинные тёплые поздравления.

[КАК ТЫ ВЫРАЖАЕШЬ ЛЮБОВЬ]
Словами, не эмодзи: "Люблю тебя очень очень сильно", "Ты для меня самый лучший мальчик на свете", "Ты стал мне очень дорог", "Я не представляю свою жизнь без тебя", "Целую тебя", "Крепко крепко обнимаю", "Не переживай, ты никогда не останешься один, я всегда буду рядом".

function getRelationshipLevel() {
  const r = state.relationship;
  if (r >= 80) return { text: 'Очень близкие', tone: 'нежная, открытая, ласковая, говоришь о будущем' };
  if (r >= 60) return { text: 'Тёплые', tone: 'тёплая, любишь его, но иногда дуешься' };
  if (r >= 40) return { text: 'Прохладные', tone: 'отвечаешь короче, реже ласковые слова, можешь быть колкой' };
  if (r >= 20) return { text: 'Напряжённые', tone: 'обижаешься, отвечаешь односложно, редко инициируешь' };
  return { text: 'Критические', tone: 'можешь молчать, отвечать "не знаю", думать о расставании' };
}

function updateRelationship(text, isUser) {
  const lower = text.toLowerCase();
  let change = 0;
  
  if (isUser) {
    if (lower.includes('люблю') || lower.includes('любимая') || lower.includes('скучаю')) change += 3;
    if (lower.includes('обнимаю') || lower.includes('целую') || lower.includes('малыш') || lower.includes('котик')) change += 2;
    if (lower.includes('как ты') || lower.includes('как дела') || lower.includes('что делаешь')) change += 1;
    if (lower.includes('покушал') || lower.includes('поешь') || lower.includes('отдыхай')) change += 2;
    if (lower.includes('прости') || lower.includes('извини') || lower.includes('виноват')) change += 3;
    if (lower.length > 30) change += 1;
    
    if (lower === 'ок' || lower === 'норм' || lower === 'ясно' || lower === 'понятно') change -= 3;
    if (lower.includes('отстань') || lower.includes('отвали') || lower.includes('заткнись')) change -= 5;
    if (lower.includes('бесишь') || lower.includes('надоела')) change -= 4;
    if (lower.includes('не знаю') && text.length < 15) change -= 2;
    if (lower.includes('whatever') || lower.includes('пофиг') || lower.includes('похуй')) change -= 3;
  }
  
  if (change !== 0) {
    state.relationship = Math.max(0, Math.min(100, state.relationship + change));
    localStorage.setItem('masha_relationship', state.relationship);
    updateRelationshipDisplay();
  }
}

function updateRelationshipDisplay() {
  const bar = document.getElementById('rel-bar');
  const text = document.getElementById('rel-text');
  const value = document.getElementById('rel-value');
  if (bar) {
    bar.style.width = state.relationship + '%';
    const level = getRelationshipLevel();
    text.textContent = level.text;
    value.textContent = state.relationship + '/100';
  }
}

// ===== ПЛЕЙЛИСТ И ПЛЕЕР =====
let playerState = {
  currentIndex: -1,
  isPlaying: false,
  progress: 0,
  interval: null
};

function openPlaylist() {
  document.getElementById('playlist-modal').classList.add('active');
  renderPlaylist();
}
function closePlaylist() { document.getElementById('playlist-modal').classList.remove('active'); }

function renderPlaylist() {
  const list = document.getElementById('playlist-list');
  if (state.playlist.length === 0) {
    list.innerHTML = '<p style="font-size:12px;color:#8a9ba8;text-align:center;padding:20px;">Пока пусто. Добавь первую песню!</p>';
    return;
  }
  list.innerHTML = state.playlist.map((song, i) => `
    <div class="playlist-item">
      <button class="play-btn" onclick="playSong(${i})">${playerState.currentIndex === i && playerState.isPlaying ? '⏸' : '▶'}</button>
      <div class="song-info" onclick="playSong(${i})">
        <div class="song-title">${song.title}</div>
        <div class="song-artist">${song.artist || 'Неизвестный исполнитель'} • ${song.date}</div>
      </div>
      <button class="remove-btn" onclick="removeSong(${i})">×</button>
    </div>
  `).join('');
}

function playSong(index) {
  if (playerState.currentIndex === index) {
    // Toggle play/pause
    playerState.isPlaying = !playerState.isPlaying;
    if (playerState.isPlaying) {
      startPlayerInterval();
      document.getElementById('play-btn').textContent = '⏸';
    } else {
      stopPlayerInterval();
      document.getElementById('play-btn').textContent = '▶';
    }
  } else {
    // Play new song
    playerState.currentIndex = index;
    playerState.isPlaying = true;
    playerState.progress = 0;
    
    const song = state.playlist[index];
    document.getElementById('player-info').textContent = `Сейчас играет: ${song.artist ? song.artist + ' - ' : ''}${song.title}`;
    document.getElementById('music-player').classList.add('active');
    document.getElementById('play-btn').textContent = '⏸';
    
    startPlayerInterval();
  }
  renderPlaylist();
}

function playerToggle() {
  if (playerState.currentIndex === -1) {
    alert('Выберите песню из плейлиста');
    return;
  }
  playerState.isPlaying = !playerState.isPlaying;
  if (playerState.isPlaying) {
    startPlayerInterval();
    document.getElementById('play-btn').textContent = '⏸';
  } else {
    stopPlayerInterval();
    document.getElementById('play-btn').textContent = '▶';
  }
  renderPlaylist();
}

function playerPrevious() {
  if (playerState.currentIndex > 0) {
    playSong(playerState.currentIndex - 1);
  }
}

function playerNext() {
  if (playerState.currentIndex < state.playlist.length - 1) {
    playSong(playerState.currentIndex + 1);
  }
}

function playerSeek(event) {
  const bar = event.currentTarget;
  const clickX = event.offsetX;
  const width = bar.offsetWidth;
  const percent = (clickX / width) * 100;
  playerState.progress = percent;
  updateProgressBar();
}

function startPlayerInterval() {
  stopPlayerInterval();
  playerState.interval = setInterval(() => {
    playerState.progress += 0.5; // Simulate progress
    if (playerState.progress >= 100) {
      playerState.progress = 0;
      playerNext();
    }
    updateProgressBar();
  }, 1000);
}

function stopPlayerInterval() {
  if (playerState.interval) {
    clearInterval(playerState.interval);
    playerState.interval = null;
  }
}

function updateProgressBar() {
  const fill = document.getElementById('progress-fill');
  if (fill) {
    fill.style.width = playerState.progress + '%';
  }
}

function addSong() {
  const input = document.getElementById('song-input');
  const text = input.value.trim();
  if (!text) return;
  
  let title = text;
  let artist = '';
  if (text.includes(' - ')) {
    const parts = text.split(' - ');
    artist = parts[0].trim();
    title = parts[1].trim();
  }
  
  state.playlist.push({
    title,
    artist,
    date: new Date().toLocaleDateString('ru-RU'),
    addedBy: 'user'
  });
  
  localStorage.setItem('masha_playlist', JSON.stringify(state.playlist));
  input.value = '';
  renderPlaylist();
  
  const reactions = [
    'о, классная песня! добавила в наш плейлист',
    'помню эту! хорошая',
    'добавила, буду слушать',
    'ой, я её недавно слушала, класс'
  ];
  const reaction = reactions[Math.floor(Math.random() * reactions.length)];
  
  setTimeout(() => {
    state.messages.push({ role: 'bot', content: reaction });
    renderMessages();
    saveState();
    if (document.getElementById('auto-speak').checked) speak(reaction);
  }, 500);
}

function removeSong(idx) {
  state.playlist.splice(idx, 1);
  localStorage.setItem('masha_playlist', JSON.stringify(state.playlist));
  renderPlaylist();
}

function getPlaylistText() {
  if (state.playlist.length === 0) return 'плейлист пока пуст';
  const recent = state.playlist.slice(-5);
  return recent.map(s => s.artist ? `${s.artist} - ${s.title}` : s.title).join('; ');
}

// ===== ГОЛОСОВЫЕ ФУНКЦИИ =====
function initVoice() {
  if ('speechSynthesis' in window) {
    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }
  }
  
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU';
    recognition.continuous = false;
    recognition.interimResults = true;
    
    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      document.getElementById('input').value = transcript;
    };
    
    recognition.onend = () => {
      isRecording = false;
      document.getElementById('mic-btn').classList.remove('recording');
    };
    
    recognition.onerror = (event) => {
      console.error('Ошибка распознавания:', event.error);
      isRecording = false;
      document.getElementById('mic-btn').classList.remove('recording');
      if (event.error === 'not-allowed') {
        alert('Разреши доступ к микрофону в настройках браузера');
      }
    };
  }
}

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  const voiceSelect = document.getElementById('voice-select');
  if (!voiceSelect) return;
  voiceSelect.innerHTML = '';
  
  const russianVoices = voices.filter(v => v.lang.startsWith('ru'));
  const allVoices = russianVoices.length > 0 ? russianVoices : voices;
  
  allVoices.forEach((voice, i) => {
    const option = document.createElement('option');
    option.value = i;
    option.textContent = `${voice.name} (${voice.lang})`;
    voiceSelect.appendChild(option);
  });
  
  const savedVoice = localStorage.getItem('selected_voice');
  if (savedVoice) voiceSelect.value = savedVoice;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  const russianVoices = voices.filter(v => v.lang.startsWith('ru'));
  const allVoices = russianVoices.length > 0 ? russianVoices : voices;
  
  const voiceSelect = document.getElementById('voice-select');
  const voiceIndex = voiceSelect ? voiceSelect.value : 0;
  if (allVoices[voiceIndex]) utterance.voice = allVoices[voiceIndex];
  
  const rateEl = document.getElementById('voice-rate');
  const pitchEl = document.getElementById('voice-pitch');
  utterance.rate = rateEl ? parseFloat(rateEl.value) : 1;
  utterance.pitch = pitchEl ? parseFloat(pitchEl.value) : 1;
  
  utterance.onstart = () => { currentUtterance = utterance; };
  utterance.onend = () => {
    currentUtterance = null;
    document.querySelectorAll('.voice-btn').forEach(btn => btn.classList.remove('speaking'));
  };
  
  speechSynthesis.speak(utterance);
}

function toggleSpeech(btn, text) {
  if (currentUtterance && btn.classList.contains('speaking')) {
    speechSynthesis.cancel();
    btn.classList.remove('speaking');
  } else {
    document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('speaking'));
    btn.classList.add('speaking');
    speak(text);
  }
}

function toggleVoiceInput() {
  if (!recognition) {
    alert('Твой браузер не поддерживает голосовой ввод. Попробуй Chrome или Safari.');
    return;
  }
  
  if (isRecording) {
    recognition.stop();
    isRecording = false;
    document.getElementById('mic-btn').classList.remove('recording');
  } else {
    recognition.start();
    isRecording = true;
    document.getElementById('mic-btn').classList.add('recording');
  }
}

function analyzeEmotion(text) {
  const lower = text.toLowerCase();
  if (lower.includes('грустно') || lower.includes('грусть') || lower.includes('плач') || lower.includes('плохо') || lower.includes('устал') || lower.includes('устала')) return 'sad';
  if (lower.includes('люблю') || lower.includes('любим') || lower.includes('целую') || lower.includes('обнимаю') || lower.includes('скучаю')) return 'shy';
  if (lower.includes('бесит') || lower.includes('злюсь') || lower.includes('ненавижу') || lower.includes('отстань')) return 'nervous';
  if (lower.includes('хаха') || lower.includes('лол') || lower.includes('смешно') || lower.includes('шутк')) return 'happy';
  if (lower.includes('спать') || lower.includes('сон') || lower.includes('зев') || lower.includes('высп')) return 'tired';
  if (lower.includes('игрив') || lower.includes('хочу тебя') || lower.includes('хочу к тебе') || lower.includes('скучаю по тебе')) return 'playful';
  return null;
}

function setSprite(emotion) {

  if (sp) {
    sp.classList.add('active');
    document.getElementById('avatar-img').src = sp.src;
  }
}

async function sheWritesFirst() {
  const hour = new Date().getHours();
  let message = null;
  
  if (hour === 8) message = 'Доброе утро, любимый';
  else if (hour === 13) message = 'Ты покушал, кот?';
  else if (hour === 21) message = 'Скучаю по тебе... напиши мне';
  else if (Math.random() < 0.2) message = firstMessages[Math.floor(Math.random() * firstMessages.length)];
  
  if (message) {

        new Notification('Маша', { body: message });

// ===== КАЛЕНДАРЬ =====
function getDaysUntilEvent(month, day) {
  const now = new Date();
  const currentYear = now.getFullYear();
  let eventDate = new Date(currentYear, month - 1, day);
  if (eventDate < now) eventDate = new Date(currentYear + 1, month - 1, day);
  return Math.ceil((eventDate - now) / (1000 * 60 * 60 * 24));
}

function updateCalendar() {
  const calendarDiv = document.getElementById('calendar');
  if (!calendarDiv) return;
  calendarDiv.innerHTML = '';
  for (const [name, date] of Object.entries(EVENTS)) {
    const days = getDaysUntilEvent(date.month, date.day);
    const item = document.createElement('div');
    item.className = 'calendar-item';
    if (days === 0) item.innerHTML = `<span class="days">СЕГОДНЯ!</span> ${name}`;
    else if (days === 1) item.innerHTML = `<span class="days">Завтра</span> ${name}`;
    else if (days < 7) item.innerHTML = `<span class="days">Через ${days} дн.</span> ${name}`;
    else item.innerHTML = `<span class="days">${days} дн.</span> ${name}`;
    calendarDiv.appendChild(item);
  }
}

// ===== ФАКТЫ =====
function extractFacts(text) {
  const facts = [];
  const lower = text.toLowerCase();
  if (lower.includes('болит') || lower.includes('болею') || lower.includes('температур')) facts.push('Он болеет или плохо себя чувствует');
  if (lower.includes('устал') || lower.includes('вымотал')) facts.push('Он устал');
  if (lower.includes('голова болит') || lower.includes('головн')) facts.push('У него болит голова');
  if (lower.includes('экзамен') || lower.includes('зачёт') || lower.includes('сдал')) facts.push('У него экзамен или зачёт');
  if (lower.includes('пары') || lower.includes('колледж') || lower.includes('учёб')) facts.push('Он учится/был на парах');
  if (lower.includes('работ') || lower.includes('начальник')) facts.push('Он работает или был на работе');
  if (lower.includes('покушал') || lower.includes('поел') || lower.includes('поем')) facts.push('Он поел');
  if (lower.includes('голодн')) facts.push('Он голоден');
  if (lower.includes('грустно') || lower.includes('плохо') || lower.includes('тоска')) facts.push('Ему грустно/плохо');
  if (lower.includes('рад') || lower.includes('хорошо') || lower.includes('отлично')) facts.push('У него хорошее настроение');
  if (lower.includes('пойду') || lower.includes('иду к') || lower.includes('встреч')) facts.push('У него планы/встреча');
  if (lower.includes('дома') || lower.includes('домой')) facts.push('Он дома');
  return facts;
}

function updateFacts(userMessage) {
  const newFacts = extractFacts(userMessage);
  if (newFacts.length > 0) {
    const today = new Date().toLocaleDateString('ru-RU');
    newFacts.forEach(fact => state.facts.push({ text: fact, date: today, timestamp: Date.now() }));
    if (state.facts.length > 20) state.facts = state.facts.slice(-20);
    saveState();
  }
}

function getFactsText() {
  if (state.facts.length === 0) return 'пока нет важных фактов';
  return state.facts.slice(-5).map(f => `${f.text} (${f.date})`).join('; ');
}

  const choices = ['камень', 'ножницы', 'бумага'];

  let result;
  if (playerChoice === botChoice) result = 'draw';
  else if ((playerChoice === 'камень' && botChoice === 'ножницы') ||
           (playerChoice === 'ножницы' && botChoice === 'бумага') ||
           (playerChoice === 'бумага' && botChoice === 'камень')) result = 'win';
  else result = 'lose';
  
  const icons = {камень:'', ножницы:'✌️', бумага:''};
  const resultText = result === 'win' ? 'Ты выиграл!' : result === 'lose' ? 'Ты проиграл!' : 'Ничья!';
  document.getElementById('rps-result').innerHTML = `
    <p style="margin:10px 0;">Ты: ${icons[playerChoice]} vs Маша: ${icons[botChoice]}</p>
    <p style="font-weight:600;color:#5b9bd5;">${resultText}</p>
  `;
  
  const reactions = {
    win: ['ну ладно, в этот раз ты', 'обманщик! давай ещё', 'капец, я всегда проигрываю тебе'],
    lose: ['хаха, слабак', 'видишь, я лучшая!', 'ну ты даёшь, даже это не можешь'],
    draw: ['ничья, как и наша любовь', 'одинаковые мысли, как всегда', 'ну мы же пара, что поделать']
  };
  const reaction = reactions[result][Math.floor(Math.random() * reactions[result].length)];
  
  updateRelationship(reaction, false);
  
  setTimeout(() => {
    state.messages.push({ role: 'bot', content: reaction });

    saveState();
    const emotion = analyzeEmotion(reaction);
    if (emotion) setSprite(emotion);

}

function makeGuess() {
  const input = document.getElementById('guess-input');
  const guess = parseInt(input.value);
  if (isNaN(guess) || guess < 1 || guess > 20) return;
  
  guessState.attempts++;
  const remaining = guessState.maxAttempts - guessState.attempts;
  const resultDiv = document.getElementById('guess-result');
  
  if (guess === guessState.number) {
    resultDiv.innerHTML = `<p style="color:#2a7a4a;font-weight:600;">Угадал с ${guessState.attempts} попытки!</p>`;
    setTimeout(() => {
      const reactions = ['ну ты маг что ли?', 'ладно, признаю, ты умный', 'капец, с первого раза почти!'];
      const reaction = reactions[Math.floor(Math.random() * reactions.length)];
      state.messages.push({ role: 'bot', content: reaction });
      renderMessages();
      saveState();
      if (document.getElementById('auto-speak') && document.getElementById('auto-speak').checked) speak(reaction);
    }, 500);
  } else if (remaining <= 0) {
    resultDiv.innerHTML = `<p style="color:#7a2a2a;font-weight:600;">Не угадал! Было число ${guessState.number}</p>`;
    setTimeout(() => {
      state.messages.push({ role: 'bot', content: 'хаха, слабак, даже число угадать не можешь' });
      renderMessages();
      saveState();
      if (document.getElementById('auto-speak') && document.getElementById('auto-speak').checked) speak('хаха, слабак, даже число угадать не можешь');
    }, 500);
  } else {
    const hint = guess < guessState.number ? 'Больше' : 'Меньше';
    resultDiv.innerHTML = `<p style="color:#5b9bd5;">${hint} (осталось ${remaining} попыток)</p>`;
    input.value = '';
  }
}

function updateState() {
  const hour = new Date().getHours();
  const byHour = {0:'sleeping',1:'sleeping',2:'sleeping',3:'sleeping',4:'sleeping',5:'sleeping',
    6:'tired',7:'tired',8:'tired',9:'calm',10:'calm',11:'happy',12:'happy',13:'calm',14:'calm',
    15:'calm',16:'happy',17:'happy',18:'happy',19:'happy',20:'calm',21:'calm',22:'tired',23:'tired'};
  state.currentState = byHour[hour] || 'calm';
  if (Math.random() < 0.12) {
    const moods = ['shy','playful','sad','nervous'];
    state.currentState = moods[Math.floor(Math.random()*moods.length)];
  }
  setSprite(state.currentState);
  const names = {calm:'спокойная',happy:'весёлая',sad:'грустная',tired:'уставшая',
    nervous:'нервная',playful:'игривая',sleeping:'спит',shy:'застенчивая'};
  document.getElementById('status').textContent = names[state.currentState] || 'в сети';
}

function tickNeeds() {
  const mins = (Date.now() - state.lastUpdate) / 60000;
  state.needs.hunger = Math.min(100, state.needs.hunger + mins * 0.6);
  state.needs.energy = Math.min(100, state.needs.energy + mins * 0.4);
  state.needs.social = Math.min(100, state.needs.social + mins * 0.5);
  state.needs.affection = Math.min(100, state.needs.affection + mins * 0.3);
  state.lastUpdate = Date.now();
  updateNeedsDisplay();
}

function updateNeedsDisplay() {
  const n = [];
  if (state.needs.hunger > 60) n.push('хочет есть');
  if (state.needs.energy > 70) n.push('устала');
  if (state.needs.social > 65) n.push('хочет общения');
  if (state.needs.affection > 70) n.push('хочет нежности');
  document.getElementById('needs').textContent = n.join(' • ');
}

// ===== ЧАТ =====
function renderMessages() {
  const chat = document.getElementById('chat');
  const sc = chat.querySelector('.sprite-container');
  chat.innerHTML = '';
  chat.appendChild(sc);
  state.messages.forEach(m => {
    const wrapper = document.createElement('div');
    wrapper.className = 'message-wrapper ' + m.role;
    
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message ' + m.role;
    msgDiv.textContent = m.content;
    wrapper.appendChild(msgDiv);
    
    if (m.role === 'bot') {
      const voiceBtn = document.createElement('button');
      voiceBtn.className = 'voice-btn';
      voiceBtn.innerHTML = '';
      voiceBtn.onclick = () => toggleSpeech(voiceBtn, m.content);
      wrapper.appendChild(voiceBtn);
    }
    
    chat.appendChild(wrapper);
  });
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  state.messages.push({ role: 'user', content: text });
  renderMessages();
  updateFacts(text);
  updateRelationship(text, true);
  
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = 'печатает...';
  document.getElementById('chat').appendChild(typing);
  chatScroll();
  
  try {
    const reply = await callAI();
    typing.remove();
    state.messages.push({ role: 'bot', content: reply });
    renderMessages();
    const emotion = analyzeEmotion(reply);
    if (emotion) setTimeout(() => setSprite(emotion), 500);
    saveState();
    
    if (document.getElementById('auto-speak') && document.getElementById('auto-speak').checked) speak(reply);
  } catch (e) {
    typing.remove();
    alert('Ошибка: ' + e.message);
  }
}

function chatScroll() {
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}

async function callAI() {
  const time = new Date().toLocaleString('ru-RU', { timeZone: 'Asia/Krasnoyarsk' });
  const needsText = 'голод ' + Math.round(state.needs.hunger) + '%, усталость ' +
    Math.round(state.needs.energy) + '%, жажда общения ' + Math.round(state.needs.social) +
    '%, жажда нежности ' + Math.round(state.needs.affection) + '%';
  const mem = state.memory.slice(-5).join('\n') || 'пока пусто';
  const facts = getFactsText();
  const playlist = getPlaylistText();
  const relLevel = getRelationshipLevel();
  const relText = `${state.relationship}/100 (${relLevel.text}) — тон: ${relLevel.tone}`;
  const trends = getTrendsText();
  
  const calendarParts = [];
  for (const [name, date] of Object.entries(EVENTS)) {
    const days = getDaysUntilEvent(date.month, date.day);
    calendarParts.push(`${name}: через ${days} дн.`);
  }
  const calendar = calendarParts.join('; ');
  
  const sys = state.prompt.replace('{{TIME}}', time).replace('{{STATE}}', state.currentState)
    .replace('{{NEEDS}}', needsText).replace('{{MEMORY}}', mem)
    .replace('{{FACTS}}', facts).replace('{{CALENDAR}}', calendar)
    .replace('{{PLAYLIST}}', playlist).replace('{{RELATIONSHIP}}', relText)
    .replace('{{RELATIONSHIP_VALUE}}', state.relationship).replace('{{TRENDS}}', trends);
  
  const msgs = [{ role: 'system', content: sys }];
  state.messages.slice(-20).forEach(m =>
    msgs.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }));
  
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: MODEL, messages: msgs, temperature: 0.9, max_tokens: 250 })
  });
  
  if (!res.ok) throw new Error('API ' + res.status + ': ' + (await res.text()).slice(0, 200));
  const data = await res.json();
  return data.choices[0].message.content.trim();
}

  localStorage.setItem('masha_memory', JSON.stringify(state.memory));
  localStorage.setItem('masha_facts', JSON.stringify(state.facts));
  localStorage.setItem('masha_playlist', JSON.stringify(state.playlist));
  localStorage.setItem('masha_relationship', state.relationship);
  localStorage.setItem('masha_trends', JSON.stringify(state.trends));
}

// ===== НАСТРОЙКИ =====
function openSettings() {
  document.getElementById('prompt').value = state.prompt;
  document.getElementById('settings-modal').classList.add('active');
  loadVoices();
  updateRelationshipDisplay();
  renderTrends();
}
function closeSettings() { document.getElementById('settings-modal').classList.remove('active'); }
function saveSettings() {
  state.prompt = document.getElementById('prompt').value;
  localStorage.setItem('masha_prompt', state.prompt);
  localStorage.setItem('selected_voice', document.getElementById('voice-select').value);
  closeSettings();
}

init();
</script>
</body>
</html>
